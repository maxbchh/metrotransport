<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Максиградская железная дорога</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#172033}
.loader{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}.loader b{display:block;font-size:20px;margin-bottom:8px}.loader span{font-size:13px;color:#6b7280}
</style>
</head>
<body>
<div class="loader" id="loader"><div><b>Загрузка Максиградской железной дороги…</b><span>Пожалуйста, подождите</span></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('index-base.html?v=20260831',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let h=await r.text();
    const marker='</body>';
    const scripts=['modern-ui.js','metro-stable-enhancements.js'];
    const extra=scripts.map(s=>`<script src="${s}?v=20260831"><\/script>`).join('');
    h=h.replace(new RegExp(marker,'i'),extra+marker);
    document.open();document.write(h);document.close();
  }catch(e){
    document.getElementById('loader').innerHTML='<div><b style="color:#b91c1c">Ошибка загрузки сайта</b><span>'+String(e.message||e)+'</span></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
