<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Максиградская железная дорога</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef4fb}
#app{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="app" title="Максиградская железная дорога" src="./index-base.html?v=20260901stable"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('app');
  function install(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.head)return;
      if(!d.getElementById('railphotoStabilityScript')){
        const s=d.createElement('script');
        s.id='railphotoStabilityScript';
        s.src='railphoto-stability.js?v=20260901';
        d.head.appendChild(s);
      }
    }catch(e){console.error('railphoto stability:',e)}
  }
  frame.addEventListener('load',()=>setTimeout(install,50));
  setTimeout(install,800);
})();
</script>
</body>
</html>
