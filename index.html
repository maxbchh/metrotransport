<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAILPHOTO — База данных подвижного состава</title>
    <style>
        :root {
            --bp-header-bg: #102a43;
            --bp-bg-main: #12181f;
            --bp-card-bg: #1b222c;
            --bp-border: #2c3848;
            --bp-table-header: #243040;
            --bp-text: #e0e6ed;
            --bp-link: #4895ef;
            --bp-input-bg: #0f141c;
        }

        body.light-theme {
            --bp-header-bg: #1e3a8a;
            --bp-bg-main: #f1f5f9;
            --bp-card-bg: #ffffff;
            --bp-border: #cbd5e1;
            --bp-table-header: #e2e8f0;
            --bp-text: #0f172a;
            --bp-link: #2563eb;
            --bp-input-bg: #ffffff;
        }

        .st-active { background-color: rgba(43, 43, 43, 0.4); }
        .st-not-operated { background-color: #2e5c2e !important; color: #ffffff !important; }
        .st-inactive { background-color: #6b6b00 !important; color: #ffffff !important; }
        .st-out { background-color: #696969 !important; color: #ffffff !important; }
        .st-decomm { background-color: #8b0000 !important; color: #ffffff !important; }
        .st-unknown { background-color: #5c4033 !important; color: #ffffff !important; }
        .st-mod { background-color: #4b6f7e !important; color: #ffffff !important; }
        .st-trans-city { background-color: #1e3f66 !important; color: #ffffff !important; }
        .st-trans-other { background-color: #512e5f !important; color: #ffffff !important; }
        .st-plate-change { background-color: #117a65 !important; color: #ffffff !important; }

        body.light-theme .st-active { background-color: #ffffff; }

        body {
            font-family: Verdana, Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bp-bg-main);
            color: var(--bp-text);
            font-size: 12px;
            transition: background 0.2s, color 0.2s;
        }

        a { color: var(--bp-link); text-decoration: none; cursor: pointer; }
        a:hover { text-decoration: underline; }

        header {
            background-color: var(--bp-header-bg);
            color: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #081726;
        }

        .logo-box {
            background: #2563eb;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            padding: 4px 10px;
            border-radius: 3px;
            letter-spacing: 1px;
            display: inline-block;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-tab-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .nav-tab-btn.active {
            background: #2563eb;
            border-color: #3b82f6;
        }

        .theme-toggle-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .main-wrapper { padding: 12px 18px; }
        
        .page-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--bp-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-primary:hover { background: #1d4ed8; }

        .btn-secondary {
            background: #333;
            color: #fff;
            border: 1px solid var(--bp-border);
            padding: 6px 12px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .category-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .cat-tab {
            padding: 6px 12px;
            background: var(--bp-card-bg);
            border: 1px solid var(--bp-border);
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            color: var(--bp-text);
        }
        .cat-tab.active {
            background: var(--bp-link);
            color: #fff;
            border-color: var(--bp-link);
        }

        .filter-panel {
            background: var(--bp-card-bg);
            border: 1px solid var(--bp-border);
            padding: 10px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            align-items: center;
        }

        .filter-panel input, .filter-panel select {
            padding: 6px 8px;
            border: 1px solid var(--bp-border);
            background: var(--bp-input-bg);
            color: var(--bp-text);
            font-size: 11px;
            border-radius: 3px;
            width: 100%;
            box-sizing: border-box;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: var(--bp-card-bg);
            border: 1px solid var(--bp-border);
        }

        table.bp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            white-space: nowrap;
        }

        table.bp-table th {
            background-color: var(--bp-table-header);
            color: var(--bp-text);
            padding: 7px 8px;
            text-align: left;
            border: 1px solid var(--bp-border);
            font-weight: bold;
        }

        table.bp-table td {
            padding: 6px 8px;
            border: 1px solid var(--bp-border);
            vertical-align: middle;
        }

        table.bp-table tbody tr { cursor: pointer; }
        table.bp-table tbody tr:hover { outline: 1px solid var(--bp-link); }

        .type-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--bp-border);
        }

        .trip-badge {
            background-color: #d9534f;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .btn-cancel-trip {
            background-color: #c9302c;
            color: white;
            border: none;
            padding: 3px 6px;
            font-size: 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-left: 8px;
            font-weight: bold;
        }

        table.bp-table tbody tr.in-trip {
            background-color: rgba(217, 83, 79, 0.2) !important;
        }

        /* Форма параметров рейса */
        .trip-form-panel {
            background: var(--bp-card-bg);
            border: 1px solid var(--bp-border);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        .trip-form-panel input {
            padding: 6px;
            background: var(--bp-input-bg);
            color: var(--bp-text);
            border: 1px solid var(--bp-border);
            border-radius: 3px;
            font-size: 11px;
            width: 100%;
            box-sizing: border-box;
        }

        .builder-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 15px;
        }
        @media (max-width: 850px) {
            .builder-layout { grid-template-columns: 1fr; }
        }

        .builder-source {
            background: var(--bp-card-bg);
            border: 1px solid var(--bp-border);
            padding: 10px;
            border-radius: 4px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .builder-source-item {
            background: var(--bp-input-bg);
            border: 1px solid var(--bp-border);
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .consist-area {
            background: var(--bp-card-bg);
            border: 2px dashed var(--bp-border);
            padding: 15px;
            border-radius: 4px;
            min-height: 300px;
        }

        .consist-track {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            min-height: 100px;
            padding: 10px;
            background: var(--bp-input-bg);
            border: 1px solid var(--bp-border);
            border-radius: 4px;
        }

        .consist-card {
            background: var(--bp-card-bg);
            border: 1px solid var(--bp-link);
            padding: 8px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body class="light-theme">

    <header>
        <div>
            <span class="logo-box">RAILPHOTO</span>
            <span style="font-size:15px; font-weight:bold; margin-left:8px;">База данных ПС</span>
        </div>
        <div class="header-controls">
            <button class="nav-tab-btn active" id="btnViewDatabase" onclick="switchPage('database')">📚 База данных</button>
            <button class="nav-tab-btn" id="btnViewBuilder" onclick="switchPage('builder')">🚂 Конструктор поездов</button>
            <button class="theme-toggle-btn" onclick="toggleTheme()">🌓 Тема</button>
        </div>
    </header>

    <!-- СТРАНИЦА 1: БАЗА ДАННЫХ -->
    <div id="pageDatabase" class="main-wrapper">
        <div class="page-header">
            <span>Подвижной состав</span>
            <div class="action-buttons">
                <button class="btn-secondary" onclick="exportDatabase()">💾 Экспорт БД</button>
                <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📂 Импорт БД</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importDatabase(event)">
            </div>
        </div>

        <div class="table-container">
            <table class="bp-table" id="dbTable">
                <thead>
                    <tr>
                        <th>Тип</th>
                        <th>Депо</th>
                        <th>Серия / Модель</th>
                        <th>Бортовой №</th>
                        <th>Статус / Рейс</th>
                        <th>Примечание</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- СТРАНИЦА 2: КОНСТРУКТОР ПОЕЗДОВ -->
    <div id="pageBuilder" class="main-wrapper" style="display:none;">
        <div class="page-header">
            <span>Параметры и составление поезда</span>
            <div class="action-buttons">
                <button class="btn-primary" onclick="sendConsistToTrip()">🚩 Отправить поезд в рейс</button>
                <button class="btn-secondary" onclick="clearConsist()">🗑 Очистить</button>
            </div>
        </div>

        <!-- Поля параметров поезда -->
        <div class="trip-form-panel">
            <div>
                <label style="font-weight:bold; font-size:11px;">Номер поезда:</label>
                <input type="text" id="tripNumber" placeholder="Например: 601Б / 702">
            </div>
            <div>
                <label style="font-weight:bold; font-size:11px;">Время отправления:</label>
                <input type="time" id="tripTime">
            </div>
            <div>
                <label style="font-weight:bold; font-size:11px;">Маршрут / Сообщение:</label>
                <input type="text" id="tripRoute" placeholder="Например: Минск — Брест">
            </div>
        </div>

        <div class="builder-layout">
            <div class="builder-source">
                <div style="font-weight:bold; margin-bottom:8px;">Доступный ПС:</div>
                <div id="builderSourceList"></div>
            </div>

            <div class="consist-area">
                <div style="font-weight:bold; font-size:13px; margin-bottom:8px;">Сформированный поезд:</div>
                <div class="consist-track" id="consistTrack"></div>
            </div>
        </div>
    </div>

    <script>
        let vehicleDB = [
            { id: "1", category: "loco", park: "ТЧ-1 Минск", model: "ЧС4Т-598", num: "598", statusCls: "st-active" },
            { id: "2", category: "loco", park: "ТЧ-1 Минск", model: "ЭП20-045", num: "045", statusCls: "st-active" },
            { id: "3", category: "pass_car", park: "ЛВЧ-1 Минск", model: "Купейный 61-4177", num: "4920", statusCls: "st-active" }
        ];

        let consistList = [];

        function switchPage(page) {
            document.getElementById('pageDatabase').style.display = (page === 'database') ? 'block' : 'none';
            document.getElementById('pageBuilder').style.display = (page === 'builder') ? 'block' : 'none';
            document.getElementById('btnViewDatabase').classList.toggle('active', page === 'database');
            document.getElementById('btnViewBuilder').classList.toggle('active', page === 'builder');
            if (page === 'builder') { renderBuilderSource(); renderConsistTrack(); }
        }

        function renderTable() {
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            vehicleDB.forEach((v) => {
                let tr = document.createElement('tr');
                let tripData = JSON.parse(localStorage.getItem(`trip_info_${v.id}`));

                if (tripData) tr.classList.add('in-trip');

                tr.innerHTML = `
                    <td><span class="type-badge">${v.category}</span></td>
                    <td><b>${v.park}</b></td>
                    <td><b>${v.model}</b></td>
                    <td>${v.num}</td>
                    <td>
                        ${tripData ? `<span class="trip-badge">Поезд №${tripData.num} (${tripData.time}) [${tripData.route}]</span>` : 'На станции'}
                    </td>
                    <td>
                        ${tripData ? `<button class="btn-cancel-trip" onclick="cancelTrip('${v.id}')">Отменить рейс</button>` : '—'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function sendConsistToTrip() {
            let num = document.getElementById('tripNumber').value.trim();
            let time = document.getElementById('tripTime').value;
            let route = document.getElementById('tripRoute').value.trim();

            if (!num || !time || !route) {
                alert("Заполните номер поезда, время отправления и маршрут!");
                return;
            }

            if (consistList.length === 0) {
                alert("Добавьте хотя бы один вагон или локомотив!");
                return;
            }

            let tripInfo = { num, time, route };

            consistList.forEach(v => {
                localStorage.setItem(`trip_info_${v.id}`, JSON.stringify(tripInfo));
            });

            alert(`Поезд №${num} (${route}) отправлен в ${time}!`);
            renderTable();
            switchPage('database');
        }

        function cancelTrip(psId) {
            localStorage.removeItem(`trip_info_${psId}`);
            renderTable();
        }

        function renderBuilderSource() {
            let list = document.getElementById('builderSourceList');
            list.innerHTML = '';
            vehicleDB.forEach((v, idx) => {
                let div = document.createElement('div');
                div.className = 'builder-source-item';
                div.innerHTML = `
                    <div><b>${v.model}</b> (№${v.num})</div>
                    <button class="btn-primary" onclick="addToConsist(${idx})">+ В поезд</button>
                `;
                list.appendChild(div);
            });
        }

        function addToConsist(idx) {
            consistList.push(vehicleDB[idx]);
            renderConsistTrack();
        }

        function renderConsistTrack() {
            let track = document.getElementById('consistTrack');
            track.innerHTML = '';
            consistList.forEach((v, idx) => {
                let card = document.createElement('div');
                card.className = 'consist-card';
                card.innerHTML = `<b>${v.model}</b> <button onclick="consistList.splice(${idx},1);renderConsistTrack();">✕</button>`;
                track.appendChild(card);
            });
        }

        function clearConsist() { consistList = []; renderConsistTrack(); }
        function toggleTheme() { document.body.classList.toggle('light-theme'); }

        renderTable();
    </script>
</body>
</html>
