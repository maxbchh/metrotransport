<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Максиградская железная дорога</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;background:#f3f6fa;color:#18324a}.loader{text-align:center;padding:24px}.loader b{display:block;font-size:20px;margin-bottom:8px}.loader span{font-size:13px;color:#60758a}</style></head><body><div class="loader"><b>Загрузка Максиградской железной дороги…</b><span>Пожалуйста, подождите</span></div><script>(async()=>{try{const r=await fetch('index-base.html?rev='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let h=await r.text();const close=String.fromCharCode(60)+'/script>';const extra='\n<script src="railphoto-metro.js">'+close+'\n<script src="railphoto-ui-fixes.js">'+close+'\n<script src="railphoto-metro-summary.js">'+close+'\n<script src="railphoto-metro-minsk-line.js">'+close+'\n';h=h.replace(/<\\/body>/i,extra+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="font:14px Arial;padding:30px;color:#b91c1c"><b>Не удалось загрузить сайт.</b><div style="margin-top:8px">'+String(e).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div></div>';console.error(e)}})();</script></body></html>
