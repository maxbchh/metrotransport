name: Fix route table contrast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix route row text contrast
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"fix: route table contrast"* ]]; then
            echo 'Fix commit detected; nothing to do.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('railphoto-route-registry.js')
          s = p.read_text(encoding='utf-8')
          old = "const rowBg=c.color+'22';const rowText=['yellow','lime','sky'].includes(r.color)?'#111827':'#fff';"
          new = "const rowBg=c.color+'2A';const rowText=r.color==='black'?'#ffffff':'#0f172a';"
          if old not in s:
              print('Target expression not found; no changes needed.')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Contrast fix applied.')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add railphoto-route-registry.js
          git commit -m 'fix: route table contrast'
          git push
