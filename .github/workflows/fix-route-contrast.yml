name: Fix route table contrast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix route row text contrast
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"fix: route table contrast"* ]]; then
            echo 'Fix commit detected; nothing to do.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('railphoto-route-registry.js')
          s = p.read_text(encoding='utf-8')
          changed = False
          patterns = [
              r"const rowBg=c\.color\+'[0-9A-Fa-f]{2}';const rowText=.*?;",
              r"const rowBg=c\.color\+'[0-9A-Fa-f]{2}';let rowText=.*?;"
          ]
          replacement = "const rowBg=c.color+'2A';const rowText=r.color==='black'?'#ffffff':'#0f172a';"
          for pat in patterns:
              ns, n = re.subn(pat, replacement, s, count=1)
              if n:
                  s = ns
                  changed = True
                  break
          marker = '<tr style="background:${rowBg};color:${rowText};box-shadow:inset 6px 0 0 ${c.color};">'
          class_marker = '<tr class="rr-line-row rr-line-${r.color}" style="background:${rowBg};color:${rowText};box-shadow:inset 6px 0 0 ${c.color};">'
          if marker in s:
              s = s.replace(marker, class_marker, 1)
              changed = True
          if 'rr-line-black td' not in s:
              anchor = '.rr-table tbody tr.rr-line-black{background:#1f2937!important}'
              rule = anchor + '.rr-table tbody tr.rr-line-black td{color:#ffffff!important}'
              if anchor in s:
                  s = s.replace(anchor, rule, 1)
                  changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Route contrast/class fix applied.')
          else:
              print('No source change required.')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add railphoto-route-registry.js
          git commit -m 'fix: freight route white text'
          git push
