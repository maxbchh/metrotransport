name: Fix route table contrast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: route table contrast') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix route row text contrast
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('railphoto-route-registry.js')
          s = p.read_text(encoding='utf-8')
          old = "const rowBg=c.color+'22';const rowText=['yellow','lime','sky'].includes(r.color)?'#111827':'#fff';"
          new = "const rowBg=c.color+'2A';const rowText=r.color==='black'?'#ffffff':'#0f172a';"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Contrast fix applied.')
          else:
              print('Target expression not found.')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add railphoto-route-registry.js
          git commit -m 'fix: route table contrast'
          git push
