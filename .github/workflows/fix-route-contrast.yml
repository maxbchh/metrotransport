name: Fix route table contrast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix route row text contrast
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"fix: route table contrast"* ]]; then
            echo 'Fix commit detected; nothing to do.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('railphoto-route-registry.js')
          s = p.read_text(encoding='utf-8')
          patterns = [
              r"const rowBg=c\.color\+'[0-9A-Fa-f]{2}';const rowText=.*?;",
              r"const rowBg=c\.color\+'[0-9A-Fa-f]{2}';let rowText=.*?;"
          ]
          replacement = "const rowBg=c.color+'2A';const rowText=r.color==='black'?'#ffffff':'#0f172a';"
          changed = False
          for pat in patterns:
              ns, n = re.subn(pat, replacement, s, count=1)
              if n:
                  s = ns
                  changed = True
                  break
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Contrast fix applied.')
          else:
              print('Route row color expression not found; checking for direct row style fallback.')
              marker = '<tr style="background:${rowBg};color:${rowText};box-shadow:inset 6px 0 0 ${c.color};">'
              if marker in s and 'const rowText=r.color===\'black\'?' not in s:
                  s = s.replace(marker, '<tr style="background:${rowBg};color:${r.color===\'black\'?\'#ffffff\':\'#0f172a\'};box-shadow:inset 6px 0 0 ${c.color};">', 1)
                  p.write_text(s, encoding='utf-8')
                  changed = True
                  print('Fallback contrast fix applied.')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add railphoto-route-registry.js
          git commit -m 'fix: route table contrast'
          git push
