name: Fix route table contrast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize freight row appearance
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"fix: lighten freight rows"* ]]; then
            echo 'Fix commit detected; nothing to do.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('railphoto-route-registry.js')
          s = p.read_text(encoding='utf-8')
          changed = False

          replacements = [
              (".rr-table tbody tr.rr-line-black{color:#ffffff!important}", ".rr-table tbody tr.rr-line-black{color:#0f172a!important}"),
              (".rr-table tbody tr.rr-line-black td{color:inherit!important}", ".rr-table tbody tr.rr-line-black td{color:#0f172a!important}"),
              (".rr-table tbody tr.rr-line-black{background:#1f2937!important}", ".rr-table tbody tr.rr-line-black{background:rgba(31,41,55,.18)!important}"),
              (".rr-table tbody tr.rr-freight-row td,.rr-table tbody tr.rr-freight-row td *{color:#ffffff!important;text-shadow:none!important;opacity:1!important}", ".rr-table tbody tr.rr-freight-row td,.rr-table tbody tr.rr-freight-row td *{color:#0f172a!important;text-shadow:none!important;opacity:1!important}"),
              ("const rowText=r.color==='black'?'#ffffff':'#0f172a';", "const rowText='#0f172a';"),
              ("const rowText=r.color==='black'?'#ffffff':'#0f172a'", "const rowText='#0f172a'"),
              ("style.setProperty('color','#ffffff','important')", "style.setProperty('color','#0f172a','important')"),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed = True

          s, n = re.subn(r"\.rr-table tbody tr\.rr-line-black\{background:#1f2937!important\}", ".rr-table tbody tr.rr-line-black{background:rgba(31,41,55,.18)!important}", s)
          changed |= n > 0
          s, n = re.subn(r"rr-line-black td\{color:inherit!important\}", "rr-line-black td{color:#0f172a!important}", s)
          changed |= n > 0

          if changed:
              p.write_text(s, encoding='utf-8')
              print('Freight rows normalized to a lighter translucent dark shade with dark readable text.')
          else:
              print('No freight appearance changes were necessary.')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add railphoto-route-registry.js
          git commit -m 'fix: lighten freight rows'
          git push
