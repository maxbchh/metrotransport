name: Validate rolling stock page

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = ['<!DOCTYPE html>', '</html>', 'id="pageDatabase"', 'id="pageSchedule"']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required markers: ' + ', '.join(missing))
          print('index.html validation passed')
          PY
