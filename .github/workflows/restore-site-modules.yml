name: Validate feature modules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
              'railphoto-route-registry.js',
              'railphoto-station-auto.js',
              'railphoto-control-center.js',
              'railphoto-release-control.js',
              'railphoto-news.js',
              'railphoto-metro.js',
              'railphoto-metro-modal.js',
              'railphoto-dsp.js',
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit('Missing module files: ' + ', '.join(missing))
          print('Feature module validation passed')
          PY
