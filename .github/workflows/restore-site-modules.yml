name: Restore full Railphoto feature modules

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and attach feature modules without removing existing code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          modules = [
              'railphoto-route-registry.js?v=restore1',
              'railphoto-station-auto.js?v=restore1',
              'railphoto-operations.js?v=restore1',
              'railphoto-control-center.js?v=restore1',
              'railphoto-release-control.js?v=restore1',
              'railphoto-news.js?v=restore2',
              'railphoto-metro.js?v=restore1',
              'railphoto-metro-modal.js?v=modal1',
              'railphoto-dsp.js?v=dsp1',
          ]
          missing = [m for m in modules if f'<script src="{m}"></script>' not in s]
          if missing:
              if marker not in s:
                  raise SystemExit('body marker not found')
              tags = '\n'.join(f'<script src="{m}"></script>' for m in missing)
              s = s.replace(marker, tags + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('All feature module tags already present; nothing to do.')
          PY
      - name: Fix duplicate ДСП navigation buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('railphoto-dsp.js')
          s = p.read_text(encoding='utf-8')
          start = s.find('function replaceMapButton(){')
          if start < 0:
              raise SystemExit('replaceMapButton function not found')
          brace = s.find('{', start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == '{':
                  depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('replaceMapButton closing brace not found')
          new_func = r'''function replaceMapButton(){
      const header=document.querySelector('header');
      if(!header)return;
      const buttons=[...header.querySelectorAll('button.nav-tab-btn,a.nav-tab-btn')];
      const norm=v=>(v||'').replace(/\s+/g,' ').trim();
      const isDsp=b=>/^🛠?\s*ДСП$/u.test(norm(b.textContent));
      const isMap=b=>/^🗺️?\s*Карта$/u.test(norm(b.textContent));
      const dspButtons=buttons.filter(isDsp);
      const mapButtons=buttons.filter(isMap);
      let keep=dspButtons[0]||mapButtons[0];
      if(!keep)return;
      [...dspButtons.slice(1),...mapButtons].forEach(b=>{if(b!==keep)b.remove();});
      keep.id='railphotoDspBtn';
      keep.textContent='🛠 ДСП';
      keep.onclick=open;
      keep.removeAttribute('href');
      keep.style.display='flex';
      document.getElementById('pageMap')?.remove();
    }'''
          s = s[:start] + new_func + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit restored module loading and navigation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html railphoto-dsp.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: keep only one DSP navigation tab"
            git push
          fi
