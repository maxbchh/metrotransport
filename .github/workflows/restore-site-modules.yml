name: Restore full Railphoto feature modules

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and attach feature modules without removing existing code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          modules = [
              'railphoto-route-registry.js?v=restore1',
              'railphoto-station-auto.js?v=restore1',
              'railphoto-operations.js?v=restore1',
              'railphoto-control-center.js?v=restore1',
              'railphoto-release-control.js?v=restore1',
              'railphoto-news.js?v=restore2',
              'railphoto-metro.js?v=restore1',
              'railphoto-metro-modal.js?v=modal1',
              'railphoto-dsp.js?v=dsp1',
          ]
          missing = [m for m in modules if f'<script src="{m}"></script>' not in s]
          if missing:
              if marker not in s:
                  raise SystemExit('body marker not found')
              tags = '\n'.join(f'<script src="{m}"></script>' for m in missing)
              s = s.replace(marker, tags + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('All feature module tags already present; nothing to do.')
          PY
      - name: Commit restored module loading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: load Metro full edit modal"
            git push
          fi
