name: Enable Supabase sync

on:
  push:
    paths:
      - 'supabase-sync.js'
      - '.github/workflows/enable-supabase-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sync script to index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="supabase-sync.js"></script>'
          if tag not in s:
              s = s.replace('</body>', f'    {tag}\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Supabase script already enabled.')
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: connect site to Supabase'
          git push