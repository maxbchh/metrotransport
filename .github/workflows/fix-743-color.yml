name: One-time fix 743 color

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix 743 line color
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          p=Path('railphoto-route-registry.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("{id:'route-743',num:'743',from:'Максиград',to:'Москва',type:'Скорый',color:'yellow'", "{id:'route-743',num:'743',from:'Максиград',to:'Москва',type:'Скорый',color:'lime'")
          s=s.replace("if(x.routeCategory==='interregional_business') x.color='yellow';", "if(x.routeCategory==='interregional_business') x.color=(String(x.num).trim()==='743'?'lime':'yellow');")
          s=s.replace("if(cat==='interregional_business')rec.color='yellow';", "if(cat==='interregional_business')rec.color=(String(num).trim()==='743'?'lime':'yellow');")
          p.write_text(s,encoding='utf-8')
          PY2
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-743-color.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add railphoto-route-registry.js .github/workflows/fix-743-color.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix 743 line color to lime'
          git push
# trigger