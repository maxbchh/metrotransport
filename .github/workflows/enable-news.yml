name: Enable News module

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach News module to index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="railphoto-news.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker in text:
                  text = text.replace(marker, f'{tag}\n{marker}', 1)
              else:
                  text += f'\n{tag}\n'
              p.write_text(text, encoding='utf-8')

      - name: Commit attachment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Attach News module to site"
          git push